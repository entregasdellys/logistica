<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Caixas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leitor de QR Code HTML5 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        html, body {
            height: 100vh;
            overflow-x: hidden;
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card-compact {
            border-radius: 10px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 12px;
            margin-bottom: 8px;
        }
        .stat-box {
            background: #eef2f7;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.6rem;
            font-weight: bold;
            color: #0d6efd;
            line-height: 1.2;
        }
        .badge-status {
            font-size: 0.75rem;
            padding: 0.4em 0.6em;
            border-radius: 6px;
        }
        .table-compact th, .table-compact td {
            padding: 4px 6px;
            font-size: 0.8rem;
        }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Cabeçalho Ultra Compacto -->
        <div class="d-flex justify-content-between align-items-center mb-1 px-1">
            <span class="fw-bold text-primary fs-6">
                <i class="fa-solid fa-truck-ramp-box me-1"></i>Controle de Caixas
            </span>
            <span id="qrInfo" class="badge bg-success d-none">
                <i class="fa-solid fa-qrcode me-1"></i>QR Lido
            </span>
        </div>

        <!-- Seleção de Veículo + Leitor QR -->
        <div class="card card-compact bg-white">
            <div class="row g-1">
                <div class="col-8">
                    <select id="selectPlaca" class="form-select form-select-sm">
                        <option value="">Selecione o Caminhão...</option>
                    </select>
                </div>
                <div class="col-2">
                    <button class="btn btn-sm btn-outline-secondary w-100" type="button" id="btnAtualizar" title="Atualizar">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
                <div class="col-2">
                    <button class="btn btn-sm btn-dark w-100" type="button" data-bs-toggle="modal" data-bs-target="#modalQrCode" onclick="iniciarLeitor()" title="Escanear QR">
                        <i class="fa-solid fa-qrcode"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Painel de Status do Caminhão -->
        <div id="painelStatus" class="card card-compact bg-white d-none">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <strong class="text-dark" id="txtPlacaHead">Caminhão ---</strong>
                <span id="badgeStatus" class="badge bg-secondary badge-status">SEM REGISTRO</span>
            </div>

            <div class="row g-2 mb-1">
                <div class="col-6">
                    <div class="stat-box">
                        <small class="text-muted d-block" style="font-size: 0.75rem;">Caixas Embarcadas</small>
                        <span id="txtCaixasSaida" class="stat-number">0</span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="stat-box">
                        <small class="text-muted d-block" style="font-size: 0.75rem;">Motorista Atual</small>
                        <span id="txtMotoristaAtual" class="fw-bold fs-6 text-dark d-block text-truncate mt-1">---</span>
                    </div>
                </div>
            </div>

            <div class="text-end" style="font-size: 0.7rem;">
                <span class="text-muted"><i class="fa-regular fa-clock me-1"></i>Carga: <span id="txtHoraSaida">---</span></span>
            </div>
        </div>

        <!-- Formulário: Lançamento de Saída -->
        <div id="cardSaida" class="card card-compact bg-white d-none">
            <div class="fw-bold text-primary mb-2" style="font-size: 0.85rem;">
                <i class="fa-solid fa-dolly me-1"></i>Nova Saída (Expedição)
            </div>
            <form id="formSaida">
                <div class="row g-2 mb-2">
                    <div class="col-7">
                        <input type="text" id="inputMotorista" class="form-control form-control-sm" required placeholder="Nome Motorista">
                    </div>
                    <div class="col-5">
                        <input type="number" id="inputCaixasSaida" class="form-control form-control-sm" min="1" required placeholder="Qtd Caixas">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold">
                    <i class="fa-solid fa-paper-plane me-1"></i>Registrar Saída
                </button>
            </form>
        </div>

        <!-- Formulário: Registro de Retorno -->
        <div id="cardRetorno" class="card card-compact bg-white d-none">
            <div class="fw-bold text-success mb-2" style="font-size: 0.85rem;">
                <i class="fa-solid fa-truck-arrow-right me-1"></i>Registrar Retorno (Baixa)
            </div>
            <form id="formRetorno">
                <div class="mb-2">
                    <input type="number" id="inputCaixasRetorno" class="form-control form-control-sm" min="0" required placeholder="Caixas Retornadas ao Pátio">
                </div>
                <button type="submit" class="btn btn-success btn-sm w-100 fw-bold">
                    <i class="fa-solid fa-check-double me-1"></i>Concluir e Dar Baixa
                </button>
            </form>
        </div>

        <!-- Histórico Recente (Visão Compacta) -->
        <div class="card card-compact bg-white flex-grow-1" style="min-height: 120px;">
            <div class="text-muted fw-bold mb-1" style="font-size: 0.75rem;">
                <i class="fa-solid fa-history me-1"></i>Últimas 3 Viagens
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-compact align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Data</th>
                            <th>Motorista</th>
                            <th>Saí.</th>
                            <th>Ret.</th>
                            <th>Dif.</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyHistorico">
                        <tr><td colspan="5" class="text-center text-muted">Selecione um caminhão...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal com Câmera para Leitura do QR Code -->
    <div class="modal fade" id="modalQrCode" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header p-2">
                    <h6 class="modal-title m-0"><i class="fa-solid fa-camera me-1"></i>Escanear QR Code</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="pararLeitor()"></button>
                </div>
                <div class="modal-body text-center p-2">
                    <div id="reader"></div>
                </div>
                <div class="modal-footer p-1">
                    <button type="button" class="btn btn-sm btn-secondary w-100" data-bs-dismiss="modal" onclick="pararLeitor()">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // CONFIGURAÇÃO DO SUPABASE
        const SUPABASE_URL = 'https://yxuyukxsuiinfglcbywu.supabase.co/';
        const SUPABASE_KEY = 'sb_publishable_JqA9GoDr2MMaZQWfqCCHNw_CZDh-r3c';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let viagemAtual = null;
        let html5QrCode = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarCaminhoes();

            const urlParams = new URLSearchParams(window.location.search);
            const placaUrl = urlParams.get('placa');

            if (placaUrl) {
                selecionarPlacaNaTela(placaUrl);
            }

            document.getElementById('selectPlaca').addEventListener('change', (e) => {
                if (e.target.value) carregarStatusCaminhao(e.target.value);
            });

            document.getElementById('btnAtualizar').addEventListener('click', () => {
                const placa = document.getElementById('selectPlaca').value;
                if (placa) carregarStatusCaminhao(placa);
            });

            document.getElementById('formSaida').addEventListener('submit', registrarSaida);
            document.getElementById('formRetorno').addEventListener('submit', registrarRetorno);
        });

        function selecionarPlacaNaTela(placa) {
            const select = document.getElementById('selectPlaca');
            select.value = placa.toUpperCase();
            if (select.value) {
                document.getElementById('qrInfo').classList.remove('d-none');
                carregarStatusCaminhao(select.value);
            } else {
                alert(`A placa ${placa} não foi encontrada.`);
            }
        }

        // --- LEITOR QR CODE ---
        function iniciarLeitor() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { fps: 10, qrbox: { width: 200, height: 200 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    pararLeitor();
                    
                    const modalEl = document.getElementById('modalQrCode');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) modal.hide();

                    let placaExtraida = decodedText;
                    if (decodedText.includes('placa=')) {
                        const url = new URL(decodedText);
                        placaExtraida = url.searchParams.get('placa');
                    }

                    if (placaExtraida) {
                        selecionarPlacaNaTela(placaExtraida);
                    }
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("Não foi possível acessar a câmera: " + err);
            });
        }

        function pararLeitor() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(err => console.error(err));
            }
        }

        // --- DADOS ---
        async function carregarCaminhoes() {
            const { data, error } = await db.from('caminhoes').select('placa, modelo').order('placa');
            const select = document.getElementById('selectPlaca');
            select.innerHTML = '<option value="">Selecione o Caminhão...</option>';

            if (!error && data) {
                data.forEach(c => {
                    select.innerHTML += `<option value="${c.placa}">${c.placa} ${c.modelo ? '- ' + c.modelo : ''}</option>`;
                });
            }
        }

        async function carregarStatusCaminhao(placa) {
            document.getElementById('txtPlacaHead').innerText = `Placa: ${placa}`;
            document.getElementById('painelStatus').classList.remove('d-none');

            const { data, error } = await db.from('controle_caixas')
                .select('*')
                .eq('placa', placa)
                .order('created_at', { ascending: false })
                .limit(1);

            viagemAtual = (data && data.length > 0) ? data[0] : null;

            if (viagemAtual && viagemAtual.status === 'EM_VIAGEM') {
                document.getElementById('badgeStatus').className = 'badge bg-warning text-dark badge-status';
                document.getElementById('badgeStatus').innerText = 'EM VIAGEM';
                document.getElementById('txtCaixasSaida').innerText = viagemAtual.caixas_saida;
                document.getElementById('txtMotoristaAtual').innerText = viagemAtual.motorista;
                document.getElementById('txtHoraSaida').innerText = new Date(viagemAtual.data_saida).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });

                document.getElementById('cardSaida').classList.add('d-none');
                document.getElementById('cardRetorno').classList.remove('d-none');
            } else {
                document.getElementById('badgeStatus').className = 'badge bg-success badge-status';
                document.getElementById('badgeStatus').innerText = 'LIVRE / PÁTIO';
                document.getElementById('txtCaixasSaida').innerText = '0';
                document.getElementById('txtMotoristaAtual').innerText = 'Nenhum';
                document.getElementById('txtHoraSaida').innerText = 'Sem viagem ativa';

                document.getElementById('cardSaida').classList.remove('d-none');
                document.getElementById('cardRetorno').classList.add('d-none');
            }

            carregarHistorico(placa);
        }

        async function registrarSaida(e) {
            e.preventDefault();
            const placa = document.getElementById('selectPlaca').value;
            const motorista = document.getElementById('inputMotorista').value;
            const caixas_saida = parseInt(document.getElementById('inputCaixasSaida').value);

            const { error } = await db.from('controle_caixas').insert([{
                placa,
                motorista,
                caixas_saida,
                status: 'EM_VIAGEM'
            }]);

            if (!error) {
                document.getElementById('formSaida').reset();
                carregarStatusCaminhao(placa);
            } else {
                alert('Erro ao registrar saída: ' + error.message);
            }
        }

        async function registrarRetorno(e) {
            e.preventDefault();
            if (!viagemAtual) return;

            const caixas_retorno = parseInt(document.getElementById('inputCaixasRetorno').value);
            const diferenca = caixas_retorno - viagemAtual.caixas_saida;

            const { error } = await db.from('controle_caixas').update({
                caixas_retorno,
                data_retorno: new Date().toISOString(),
                diferenca,
                status: 'FINALIZADO'
            }).eq('id', viagemAtual.id);

            if (!error) {
                document.getElementById('formRetorno').reset();
                carregarStatusCaminhao(viagemAtual.placa);
            } else {
                alert('Erro ao registrar retorno: ' + error.message);
            }
        }

        async function carregarHistorico(placa) {
            const { data } = await db.from('controle_caixas')
                .select('*')
                .eq('placa', placa)
                .order('created_at', { ascending: false })
                .limit(3);

            const tbody = document.getElementById('tbodyHistorico');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Nenhum histórico.</td></tr>';
                return;
            }

            data.forEach(row => {
                let badgeDif = '<span class="badge bg-secondary">0</span>';
                if (row.diferenca < 0) {
                    badgeDif = `<span class="badge bg-danger">${row.diferenca}</span>`;
                } else if (row.diferenca > 0) {
                    badgeDif = `<span class="badge bg-info text-dark">+${row.diferenca}</span>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(row.data_saida).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}</td>
                        <td class="text-truncate" style="max-width: 80px;">${row.motorista}</td>
                        <td class="fw-bold">${row.caixas_saida}</td>
                        <td>${row.caixas_retorno ?? '-'}</td>
                        <td>${row.status === 'FINALIZADO' ? badgeDif : '<small class="text-warning">Em rota</small>'}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
